# Обновления зависимостей раз в месяц (план, 1.2: ежемесячный аудит).
# Каждое обновление приходит отдельным PR и проходит те же проверки CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Мелкие обновления одним PR, мажорные — по одному
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Мажорные версии, которые ломают сборку или опережают среду: переходим вручную.
      # TypeScript 7 и ESLint 10 не проходят lint/tsc; @types/node держим под Node 22 (Vercel, CI).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
