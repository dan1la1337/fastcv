# Обновления зависимостей раз в месяц (план, 1.2: ежемесячный аудит).
# Каждое обновление приходит отдельным PR и проходит те же проверки CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Мелкие обновления одним PR, мажорные — по одному
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
