name: Probe gemini
on:
  push:
    branches: ["probe/gemini-speed"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q -r requirements.txt beautifulsoup4
          python3 probe/gemini.py || true
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe/gemini_result.json && git commit -qm "probe result" && git push -q
