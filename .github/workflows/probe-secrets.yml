name: Probe secrets
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Probe sitemaps
        run: |
          pip install -q requests
          # Российские корневые сертификаты (НУЦ Минцифры) — ими подписаны сайты банков
          curl -s --max-time 30 -o ru_root.cer https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer || true
          curl -s --max-time 30 -o ru_sub.cer https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer || true
          python3 - <<'PY'
          import json, re, time, requests, gzip, io, os, ssl, certifi, subprocess
          bundle = "bundle.pem"
          with open(bundle, "w") as b:
              b.write(open(certifi.where()).read())
              for f in ("ru_root.cer", "ru_sub.cer"):
                  if os.path.exists(f) and os.path.getsize(f) > 100:
                      pem = subprocess.run(["openssl", "x509", "-inform", "DER", "-in", f], capture_output=True, text=True).stdout \
                            or subprocess.run(["openssl", "x509", "-in", f], capture_output=True, text=True).stdout
                      b.write("\n" + pem)
          UA = "Mozilla/5.0 (compatible; FastCVBot/1.0; +https://fastcv.ru)"
          S = requests.Session(); S.headers["User-Agent"] = UA; S.verify = bundle
          def get(u):
              r = S.get(u, timeout=25); c = r.content
              if u.endswith(".gz") or c[:2] == b"\x1f\x8b":
                  try: c = gzip.decompress(c)
                  except Exception: pass
              return r.status_code, c.decode("utf-8", "replace")
          out = []
          VAC = re.compile(r"vacanc|vakans|/job|career|rabota", re.I)
          for line in open("probe_careers3.txt"):
              name, base = line.split(); row = {"name": name}
              try:
                  st, robots = get(base.rstrip("/") + "/robots.txt")
                  maps = re.findall(r"(?im)^sitemap:\s*(\S+)", robots) if st == 200 else []
                  if not maps: maps = [base.rstrip("/") + "/sitemap.xml"]
                  row["sitemaps"] = maps[:5]
                  urls, seen = [], 0
                  queue = list(maps[:6])
                  while queue and seen < 25:
                      sm = queue.pop(0); seen += 1
                      try: st, x = get(sm)
                      except Exception: continue
                      if st != 200: continue
                      locs = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", x)
                      if "<sitemapindex" in x:
                          subs = [l for l in locs if VAC.search(l)] or locs[:3]
                          queue.extend(subs[:8])
                      else:
                          urls += locs
                  vac = [u for u in urls if re.search(r"vacanc|vakans|/vacancy|/job/|/jobs/", u, re.I)]
                  import random; random.seed(1)
                  row["urls_total"] = len(urls); row["vacancy_urls"] = len(vac); row["sample"] = random.sample(vac, min(12, len(vac)))
                  shapes = {}
                  for u in vac:
                      k = re.sub(r"[0-9]+", "N", re.sub(r"^https?://[^/]+", "", u)); k = "/".join(k.split("/")[:4])
                      shapes[k] = shapes.get(k, 0) + 1
                  row["shapes"] = sorted(shapes.items(), key=lambda x: -x[1])[:8]
                  if vac:
                      st, h = get(vac[min(5, len(vac)-1)])
                      row["page_status"] = st
                      row["page_jobposting"] = len(re.findall(r'"@type"\s*:\s*"JobPosting"', h))
                      row["page_next"] = "__NEXT_DATA__" in h
                      text = re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", h, flags=re.S)
                      row["page_text"] = len(re.sub(r"\s+", " ", text))
              except Exception as e:
                  row["err"] = f"{type(e).__name__}: {str(e)[:120]}"
              out.append(row); time.sleep(1)
          json.dump(out, open("probe_careers3.json", "w"), ensure_ascii=False, indent=1)
          PY
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe_careers3.json && git commit -qm "probe sitemaps result" && git push -q
