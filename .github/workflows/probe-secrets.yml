name: Probe secrets
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Account hashes (no values printed)
        env:
          C: ${{ secrets.E2E_CANDIDATE_EMAIL }}
          E: ${{ secrets.E2E_EMPLOYER_EMAIL }}
        run: |
          h() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sha256sum | cut -c1-12; }
          echo "::notice title=candidate::$(h "$C")"
          echo "::notice title=employer::$(h "$E")"
