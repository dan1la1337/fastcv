name: Probe secrets
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resend key (no values printed, no email sent)
        env:
          KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          [ -n "$KEY" ] && echo "::notice title=secret::RESEND_API_KEY set, prefix ok: $([[ $KEY == re_* ]] && echo yes || echo no)" || { echo "::notice title=secret::RESEND_API_KEY MISSING"; exit 0; }
          r=$(curl -s --max-time 20 -H "Authorization: Bearer $KEY" https://api.resend.com/domains)
          echo "::notice title=resend::$(echo "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print([(x.get("name"), x.get("status")) for x in d.get("data", [])] if "data" in d else (d.get("name"), d.get("message")))')"
