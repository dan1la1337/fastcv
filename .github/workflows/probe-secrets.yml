name: Probe secrets
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secrets present (values are never printed)
        env:
          A: ${{ secrets.E2E_CANDIDATE_EMAIL }}
          B: ${{ secrets.E2E_CANDIDATE_PASSWORD }}
          C: ${{ secrets.E2E_EMPLOYER_EMAIL }}
          D: ${{ secrets.E2E_EMPLOYER_PASSWORD }}
          E: ${{ secrets.SUPERJOB_API_KEY }}
        run: |
          for v in A:E2E_CANDIDATE_EMAIL B:E2E_CANDIDATE_PASSWORD C:E2E_EMPLOYER_EMAIL D:E2E_EMPLOYER_PASSWORD E:SUPERJOB_API_KEY; do
            k=${v%%:*}; n=${v#*:}; [ -n "${!k}" ] && echo "::notice title=secret::$n set" || echo "::notice title=secret::$n MISSING"
          done
      - name: SuperJob sample
        env:
          KEY: ${{ secrets.SUPERJOB_API_KEY }}
        run: |
          since=$(( $(date +%s) - 86400 ))
          curl -s --max-time 30 -H "X-Api-App-Id: $KEY" "https://api.superjob.ru/2.0/vacancies/?count=100&page=0&date_published_from=$since&order_field=date&order_direction=desc" > sj.json
          python3 - <<'PY'
          import json, collections
          d = json.load(open("sj.json"))
          if "error" in d: print("::notice title=sj::error " + json.dumps(d["error"], ensure_ascii=False)[:300]); raise SystemExit
          objs = d.get("objects") or []
          print(f"::notice title=sj::total={d.get('total')} more={d.get('more')} page={len(objs)}")
          if objs:
              o = objs[0]
              print("::notice title=sj keys::" + ",".join(sorted(o.keys()))[:900])
              short = {k: o.get(k) for k in ["id","profession","firm_name","payment_from","payment_to","currency","agreement","link","date_published","date_pub_to","is_archive","is_closed","age","experience","type_of_work","place_of_work","town","catalogues","client"]}
              s = json.dumps(short, ensure_ascii=False)
              for i in range(0, min(len(s), 2400), 800): print(f"::notice title=sj obj{i}::" + s[i:i+800])
              print("::notice title=sj text::" + json.dumps({k: (o.get(k) or "")[:150] for k in ["candidat","work","compensation","vacancyRichText"]}, ensure_ascii=False)[:900])
          PY
