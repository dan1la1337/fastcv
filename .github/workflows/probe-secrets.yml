name: Probe secrets
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe career sites
        run: |
          pip install -q requests beautifulsoup4
          python3 - <<'PY'
          import json, re, time, requests
          from urllib.parse import urlparse
          from urllib import robotparser
          UA = "Mozilla/5.0 (compatible; FastCVBot/1.0; +https://fastcv.ru)"
          out = []
          for line in open("probe_careers.txt"):
              name, url = line.split()
              row = {"name": name, "url": url}
              try:
                  u = urlparse(url)
                  rp = robotparser.RobotFileParser(f"{u.scheme}://{u.netloc}/robots.txt")
                  try:
                      rp.read(); row["robots_ok"] = rp.can_fetch("FastCVBot", url)
                  except Exception as e:
                      row["robots_ok"] = f"err {type(e).__name__}"
                  r = requests.get(url, timeout=25, headers={"User-Agent": UA, "Accept-Language": "ru"})
                  h = r.text
                  row.update(status=r.status_code, final=r.url[:120], size=len(h),
                             title=(re.search(r"<title[^>]*>(.*?)</title>", h, re.S) or [None, ""])[1].strip()[:80])
                  row["jobposting"] = len(re.findall(r'"@type"\s*:\s*"JobPosting"', h))
                  row["next_data"] = "__NEXT_DATA__" in h
                  row["nuxt"] = "__NUXT__" in h
                  links = set(re.findall(r'href="([^"]*vacanc[^"]*)"', h, re.I))
                  row["vacancy_links"] = len(links)
                  row["link_sample"] = sorted(links)[:3]
                  row["api"] = sorted(set(re.findall(r'["\']((?:https?://[^"\']+)?/[^"\'\s]*api[^"\'\s]*)["\']', h)))[:8]
                  row["captcha"] = bool(re.search(r"captcha|ddos-guard|cf-challenge|smartcaptcha", h, re.I))
              except Exception as e:
                  row["err"] = f"{type(e).__name__}: {str(e)[:100]}"
              out.append(row); time.sleep(1)
          json.dump(out, open("probe_careers.json", "w"), ensure_ascii=False, indent=1)
          PY
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe_careers.json && git commit -qm "probe careers result" && git push -q
