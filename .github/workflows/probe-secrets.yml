name: Probe secrets
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SuperJob params
        env:
          KEY: ${{ secrets.SUPERJOB_API_KEY }}
        run: |
          now=$(date +%s); a=$((now-3600)); b=$((now-1))
          q() { r=$(curl -s --max-time 30 -H "X-Api-App-Id: $KEY" "https://api.superjob.ru/2.0/vacancies/?$1"); echo "::notice title=$2::$(echo "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("err", d.get("error")) if "error" in d else print("total", d.get("total"), "n", len(d.get("objects") or []), "more", d.get("more"), "trud", sum(1 for o in d.get("objects") or [] if o.get("trud_vsem")))')"; }
          q "count=100&page=0" base
          q "count=100&page=0&date_published_from=$a" from
          q "count=100&page=0&date_published_from=$a&date_published_to=$b" from_to
          q "count=100&page=0&date_published_from=$a&date_published_to=$b&order_field=date&order_direction=asc" from_to_asc
          q "count=100&page=0&period=1" period1
