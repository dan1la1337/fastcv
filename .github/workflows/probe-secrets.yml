name: Probe secrets
on:
  push:
    branches: ["probe/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Page heads
        run: |
          pip install -q requests
          python3 - <<'PY'
          import re, html, requests, time, ssl, certifi
          pems=[open(certifi.where()).read()]
          for u in ["https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer","https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer"]:
              try: pems.append(ssl.DER_cert_to_PEM_cert(requests.get(u,timeout=20).content))
              except Exception: pass
          open("b.pem","w").write("\n".join(pems))
          S=requests.Session(); S.verify="b.pem"; S.headers["User-Agent"]="Mozilla/5.0 (compatible; FastCVBot/1.0; +https://fastcv.ru)"
          pages = ["https://job.mts.ru/vacancy/80555827261406669","https://job.mts.ru/vacancy/716958269020569856",
                   "https://team.vk.company/vacancy/46274/","https://selectel.ru/careers/all/vacancy/1967/",
                   "https://job.alfabank.ru/vacancies/moskva/central-office/rukovoditel-napravleniia-pervichnyikh-prodazh-(iuridicheskie-litsa)_38787",
                   "https://www.tbank.ru/career/it/vacancy/murom/product-manager-v-t-bank/019e8406-0ea0-7175-a543-e47fe3fe711c/"]
          def g(p, h):
              m = re.search(p, h, re.S|re.I); return html.unescape(re.sub(r"<[^>]+>|\s+"," ", m.group(1))).strip()[:160] if m else None
          for u in pages:
              try:
                  r=S.get(u,timeout=25); h=r.text
                  print(f"::notice title={u.split('/')[2]} status::{r.status_code}")
                  for name,p in [("title",r"<title[^>]*>(.*?)</title>"),("h1",r"<h1[^>]*>(.*?)</h1>"),("og_title",r'property="og:title"\s+content="([^"]*)"'),
                                 ("og_desc",r'property="og:description"\s+content="([^"]*)"'),("desc",r'name="description"\s+content="([^"]*)"')]:
                      print(f"::notice title={u.split('/')[2]} {name}::{g(p,h)}")
              except Exception as e:
                  print(f"::notice title=err::{u} {type(e).__name__}")
              time.sleep(3)
          PY
