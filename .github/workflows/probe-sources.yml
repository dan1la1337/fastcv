name: Probe sources
on:
  push:
    branches: ["probe/sources2"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Probe
        env:
          SUPERJOB_API_KEY: ${{ secrets.SUPERJOB_API_KEY }}
        run: |
          pip install -q requests beautifulsoup4
          PYTHONPATH=. python3 probe/probe.py
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add probe/result.json && git commit -qm "probe result" && git push -q
