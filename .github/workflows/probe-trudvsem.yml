name: Probe trudvsem
on:
  push:
    branches: [probe/trudvsem]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Offset semantics and order
        run: |
          base="https://opendata.trudvsem.ru/api/v1/vacancies"
          since=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          for off in 0 1 2 4; do
            curl -s --max-time 40 "$base?modifiedFrom=$since&limit=2&offset=$off" | python3 -c "
          import sys,json; d=json.load(sys.stdin); v=[x['vacancy'] for x in d['results']['vacancies']]; print('off=$off', [(x['id'][:8], x['date_modify']) for x in v], 'exp=', [x.get('requirement') for x in v])" | sed 's/^/::notice title=page::/'
          done
          curl -s --max-time 40 "$base?modifiedFrom=$since&limit=100&offset=300" | python3 -c "import sys,json; d=json.load(sys.stdin); print('off300', d.get('status'), len((d.get('results') or {}).get('vacancies') or []))" | sed 's/^/::notice title=deep::/'
