name: Scheduled Vacancy Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Не запускать два сборщика одновременно: второй дождётся первого
concurrency:
  group: vacancy-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Обычный прогон — несколько минут; лимит страхует от зависания
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Основной ключ сборщика (обходит RLS). Добавьте секрет в
          # Settings → Secrets and variables → Actions.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # -u: вывод сразу попадает в лог Actions, а не копится в буфере до конца
        run: python -u main.py
