name: Scheduled Vacancy Scraper

on:
  schedule:
    # Каждые 2 часа; утренний — отдельной строкой ниже. Не в начале часа: на :00 GitHub
    # перегружен, и запуски по расписанию опаздывали на 2,5–5 часов
    - cron: '23 0,2,4,8,10,12,14,16,18,20,22 * * *'
    # Утренний запуск (~09:20 по Москве) дополнительно присылает сводку за сутки
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Только отправить тестовое сообщение в Telegram (без сбора)'
        type: boolean
        default: false
      daily_report:
        description: 'После сбора прислать сводку за сутки'
        type: boolean
        default: false
      backfill_company:
        description: 'После сбора дозаполнить компанию, тип нанимателя и опыт у N старых вакансий (0 — нет, до 600 за запуск)'
        type: number
        default: 0

# Не запускать два сборщика одновременно: второй дождётся первого
concurrency:
  group: vacancy-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Каналы — до 14 мин, «Работа России» — до 10 мин, плюс установка и подборки;
    # лимит с запасом страхует от зависания
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        id: scrape
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          # Основной ключ сборщика (обходит RLS). Добавьте секрет в
          # Settings → Secrets and variables → Actions.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Оповещения о сбоях владельцу (бот из @BotFather); без них сборщик просто молчит
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Бот подборок для кандидатов (отдельный от оповещений); без него подборки не рассылаются
          TELEGRAM_JOBS_BOT_TOKEN: ${{ secrets.TELEGRAM_JOBS_BOT_TOKEN }}
          ALERT_TEST: ${{ inputs.test_alert }}
          DAILY_REPORT: ${{ github.event.schedule == '23 6 * * *' || inputs.daily_report == true }}
          BACKFILL_COMPANY: ${{ inputs.backfill_company || 0 }}
        # -u: вывод сразу попадает в лог Actions, а не копится в буфере до конца
        run: python -u main.py

      # Сбой до запуска сборщика (установка зависимостей) или зависание дольше лимита:
      # сам сборщик в этих случаях написать не успевает. Его собственные падения
      # (outcome == failure) он уже сообщил сам.
      - name: Alert on workflow failure
        if: (failure() || cancelled()) && steps.scrape.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -sS -o /dev/null --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ FastCV: запуск сборщика прервался (ошибка установки или превышен лимит 30 минут). Лог: ${RUN_URL}" \
            || true
