name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run scraper tests
        run: python -m pytest -q tests --ignore=tests/db

  # Правила доступа к базе: все миграции supabase/migrations на чистом Postgres той же
  # версии, что в Supabase (базовая — дважды: она должна быть повторяемой), и ~50 проверок от имени anon, кандидата,
  # работодателя и сборщика. Ломается правило — красный CI до мержа.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      FASTCV_DB_TESTS: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Access rules (RLS) tests
        run: python -m pytest -v tests/db

  web:
    runs-on: ubuntu-latest
    env:
      # Сборке нужны публичные переменные; настоящие ключи для проверки не требуются
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint src --max-warnings 0
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Сквозные тесты в браузере (Playwright, десктоп и телефон): собранный сайт против
  # тестовой базы fastcv-staging. Публичный ключ тестовой базы не секрет — он и так
  # уходит в браузер каждого посетителя превью.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://zcyccnlweanhcsumplbx.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_tK5iei3B-RnmUCRmuWZBzQ_7DykeHGP
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npx next build
      - name: End-to-end tests
        run: npx playwright test
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
